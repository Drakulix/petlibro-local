name: Sync Changelog to Issue

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Find changelog issue
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER=$(gh issue list --label changelog --state open --limit 1 --json number --jq '.[0].number')
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            echo "No open issue with label 'changelog' found. Create one and label it 'changelog'." >&2
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Update changelog issue body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit ${{ steps.find_issue.outputs.number }} --body-file CHANGELOG.md
